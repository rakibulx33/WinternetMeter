name: Release

# Push a tag like v2.0.0 → builds everything and publishes a GitHub Release.
# Changes to packaging files also run a dry build (artifacts only, no release).
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "installer/**"
      - "packaging/**"
      - "gnome-extension/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no release is published from a manual run)"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}";
          elif [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}";
          else v="0.0.0-ci.${{ github.run_number }}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            inno_arch: x64compatible
          - rid: win-arm64
            inno_arch: arm64
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish single-file exe
        run: >
          dotnet publish src/WinternetMeter.Windows -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ env.VERSION }} -o publish/${{ matrix.rid }}
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:VERSION" `
            "/DArch=${{ matrix.rid }}" `
            "/DArchAllowed=${{ matrix.inno_arch }}" `
            "/DSourceExe=..\publish\${{ matrix.rid }}\WinternetMeter.exe" `
            installer\winternetmeter.iss
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "publish/${{ matrix.rid }}/WinternetMeter.exe" "dist/WinternetMeter-$env:VERSION-${{ matrix.rid }}-portable.exe"
          Copy-Item "installer/Output/*.exe" dist/
      - name: Test installer (install → run → uninstall)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "*-setup.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=startup" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\WinternetMeter\WinternetMeter.exe"
          if (-not (Test-Path $exe)) { Write-Error "Not installed at $exe"; exit 1 }
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run")."Winternet Meter"
          Write-Host "Startup entry: $run"
          if ($run -ne "`"$exe`"") { Write-Error "Startup entry wrong"; exit 1 }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { Write-Error "Installed app exited early"; exit 1 }
          $uninstaller = Join-Path $env:LOCALAPPDATA "Programs\WinternetMeter\unins000.exe"
          Start-Process $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          # The uninstaller hands off to a temp copy of itself; give it time to finish.
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { Write-Error "Uninstall left the exe behind"; exit 1 }
          if (Get-Process WinternetMeter -ErrorAction SilentlyContinue) { Write-Error "Meter still running after uninstall"; exit 1 }
          $left = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue)."Winternet Meter"
          if ($left) { Write-Error "Uninstall left the startup entry"; exit 1 }
          Get-ChildItem dist | Format-Table Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.rid }}
          path: dist/*

  linux:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            deb_arch: amd64
            appimage_arch: x86_64
          - rid: linux-arm64
            deb_arch: arm64
            appimage_arch: ""
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Publish single-file binary
        run: >
          dotnet publish src/WinternetMeter.Linux -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ env.VERSION }} -o publish/${{ matrix.rid }}
      - name: Build .deb
        env:
          ARCH: ${{ matrix.deb_arch }}
          BINARY: publish/${{ matrix.rid }}/winternetmeter
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          mkdir -p dist
          envsubst < packaging/linux/nfpm.yaml > nfpm.generated.yaml
          "$(go env GOPATH)/bin/nfpm" package --config nfpm.generated.yaml --packager deb --target dist/
      - name: Build AppImage
        if: matrix.appimage_arch != ''
        run: |
          set -e
          app=AppDir
          mkdir -p $app/usr/bin
          cp publish/${{ matrix.rid }}/winternetmeter $app/usr/bin/
          cp packaging/linux/winternetmeter.desktop $app/
          cp packaging/linux/winternetmeter.png $app/
          cp packaging/linux/AppRun $app/AppRun
          chmod +x $app/AppRun $app/usr/bin/winternetmeter
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage
          chmod +x appimagetool
          ARCH=${{ matrix.appimage_arch }} APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool $app "dist/WinternetMeter-${VERSION}-${{ matrix.appimage_arch }}.AppImage"
      - name: Tarball
        run: tar -C publish/${{ matrix.rid }} -czf "dist/winternetmeter-${VERSION}-${{ matrix.rid }}.tar.gz" winternetmeter
      - name: Test .deb and AppImage (install → run)
        if: matrix.rid == 'linux-x64'
        run: |
          set -e
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          dpkg-deb -c dist/*.deb
          sudo apt-get install -y -q ./dist/winternetmeter_*_amd64.deb
          test -x /usr/bin/winternetmeter
          test -f /usr/share/applications/winternetmeter.desktop
          desktop-file-validate /usr/share/applications/winternetmeter.desktop || true
          set +e
          timeout 8 xvfb-run -a winternetmeter; code=$?
          set -e
          echo ".deb run exit code: $code"; test "$code" -eq 124
          chmod +x dist/*.AppImage
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 8 xvfb-run -a dist/*.AppImage; code=$?
          set -e
          echo "AppImage run exit code: $code"; test "$code" -eq 124
          sudo apt-get remove -y -q winternetmeter
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.rid }}
          path: dist/*

  gnome-extension:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip extension
        run: |
          mkdir -p dist
          cd gnome-extension/winternetmeter@rakibulx33
          zip -r ../../dist/winternetmeter@rakibulx33.shell-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: gnome-extension
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, linux, gnome-extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Winternet Meter ${{ needs.version.outputs.value }}
          generate_release_notes: true
          files: dist/*
